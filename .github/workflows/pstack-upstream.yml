name: pstack upstream sync
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pstack-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'gyuha-hwang/cursor-plugins'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate Git transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Check upstream and propose reviewed update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node codex/pstack/scripts/sync-upstream.mjs --apply
